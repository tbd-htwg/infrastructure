services:
  caddy:
    image: ghcr.io/tbd-htwg/caddy-hetzner:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - HETZNER_API_TOKEN=${HETZNER_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - ./data:/data:rw,Z
      - ./config:/config:rw,Z
      - ./static:/srv/static:ro,Z
      - ./logs:/var/log/caddy:rw,Z
    networks:
      - caddy-network

  frontend:
    image: ghcr.io/tbd-htwg/frontend:main
    restart: always
    networks:
      - caddy-network

  backend:
    image: ghcr.io/tbd-htwg/backend:main
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    networks:
      - caddy-network

  postgres:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caddy-network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  caddy-network:
    driver: bridge