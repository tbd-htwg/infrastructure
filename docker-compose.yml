# docker-compose.yml
version: "3.9"

services:
  caddy:
    image: ghcr.io/tbd-htwg/caddy-hetzner:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - HETZNER_API_TOKEN=${HETZNER_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - ./data:/data:rw,Z
      - ./config:/config:rw,Z
      - ./static:/srv/static:ro,Z
      - ./logs:/var/log/caddy:rw,Z
    networks:
      - caddy-network

  frontend:
    image: ghcr.io/tbd-htwg/frontend:main
    restart: unless-stopped

  backend:
    image: ghcr.io/tbd-htwg/backend:main
    restart: unless-stopped
    volumes:
      - backend_db:/app/db

volumes:
  caddy_data:
  caddy_config:
  backend_db:

networks:
  caddy-network:
    driver: bridge