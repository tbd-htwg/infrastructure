global:
  nameOverride: ""
  fullnameOverride: ""
  namespace: ""
  tier: "free"
  tenantId: ""
  hostnames: []
  imagePullSecrets: []
  hosts:
    api: "api.k8s.tbd-htwg.de"
  corsAllowedOrigins: "https://k8s.tbd-htwg.de"
  identityPlatform:
    tenantId: ""
  frontend:
    bucketName: ""
    bucketPrefix: ""
    brandName: "TripPlanning"
    colorScheme: "default"
    brandIcon: ""
  storage:
    imagesBucketName: ""
    imagesPrefix: ""
  search:
    indexName: "tripentity"
  cache:
    keyPrefix: ""
  cloudSql:
    enabled: false
    connectionName: ""
    databaseName: "tripplanning"
    userName: "tripplanning_app"
    proxyImage: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.0"
    proxyPort: 5432

apiRouter:
  mode: "free"
  enforceKnownHosts: false
  tenantHeader: "X-Tenant-ID"
  identityTenantHeader: "X-Identity-Platform-Tenant-ID"
  tenants: []
  platform:
    enabled: true
    serviceName: platform-service
    namespace: tripplanning-system
    port: 8083
  loadBalancer:
    enabled: false
    ip: ""
    annotations: {}
    externalTrafficPolicy: Cluster

services:
  apiRouter:
    name: api-router
    image:
      repository: nginx
      tag: 1.27-alpine
      pullPolicy: IfNotPresent
    port: 8088
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  trip:
    name: trip-service
    image:
      repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
      tag: latest
      pullPolicy: Always
    port: 8080
    replicas: 1
    terminationGracePeriodSeconds: 30
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    resources:
      requests:
        cpu: "300m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    env:
      SPRING_PROFILES_ACTIVE: "k8s"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/tripplanning"
      SPRING_DATASOURCE_USERNAME: "tripplanning_app"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      ELASTICSEARCH_PROTOCOL: "http"
      ELASTICSEARCH_HOSTS: "opensearch:9200"
      HIBERNATE_SEARCH_BACKEND_VERSION: "opensearch:2.19"
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
      TRIPPLANNING_SOCIAL_SERVICE_URL: "http://social-service:8081"
      TRIPPLANNING_EXTERNAL_INFO_SERVICE_URL: "http://external-info-service:8082"
      TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: ""
      CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
      GCP_IMPERSONATE_SERVICE_ACCOUNT: ""
    secretRefs:
      - trip-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    bootstrap:
      waitForValkey: false
      waitForSearch: false
    neg:
      enabled: true

  social:
    name: social-service
    image:
      repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
      tag: latest
      pullPolicy: Always
    port: 8081
    replicas: 1
    resources:
      requests:
        cpu: "200m"
        memory: "384Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SPRING_PROFILES_ACTIVE: "cloud"
      SERVER_PORT: "8081"
      CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
      TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: ""
      TRIPPLANNING_TRIP_SERVICE_URL: "http://trip-service:8080"
      GCP_FIRESTORE_DATABASE_ID: "tbd-firestore"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
    secretRefs:
      - social-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    bootstrap:
      waitForValkey: false

  externalInfo:
    name: external-info-service
    image:
      repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
      tag: latest
      pullPolicy: Always
    port: 8082
    replicas: 1
    resources:
      requests:
        cpu: "150m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      SERVER_PORT: "8082"
      CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
    secretRefs:
      - external-info-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    bootstrap:
      waitForValkey: false

routes:
  - path: /api/v2/comments
    service: social-service
    port: 8081
    pathType: PathPrefix
  - path: /api/v2/external
    service: external-info-service
    port: 8082
    pathType: PathPrefix
  - path: /api/search
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /api/v2/trips
    service: api-router
    port: 8088
    pathType: PathPrefix
  - path: /api/v2/users
    service: api-router
    port: 8088
    pathType: PathPrefix
  - path: /api/v2
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /actuator
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /swagger-ui
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /v3
    service: trip-service
    port: 8080
    pathType: PathPrefix

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 0
  scaleUpStabilizationSeconds: 60
  scaleDownStabilizationSeconds: 300
  trip:
    minReplicas: null
    maxReplicas: null
    targetCPUUtilizationPercentage: null
    targetMemoryUtilizationPercentage: null
  social:
    minReplicas: null
    maxReplicas: null
  externalInfo:
    minReplicas: null
    maxReplicas: null

backingServices:
  postgres:
    enabled: true
    serviceName: postgres
    image: postgres:15-alpine
    database: tripplanning
    storageClassName: "standard"
    dataDir: "/var/lib/postgresql/data/pgdata"
    storageSize: 2Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "2Gi"
    auth:
      username: tripplanning_app
      password: ""
      existingSecret: ""
      passwordKey: password
    extraConfigArgs: []
  valkey:
    enabled: true
    serviceName: valkey
    image: valkey/valkey:8-alpine
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"
  opensearch:
    enabled: true
    resourceName: opensearch
    serviceName: opensearch
    existingClaim: ""
    image: opensearchproject/opensearch:2.19.0
    javaOpts: "-Xms512m -Xmx512m"
    storageClassName: "standard"
    storageSize: 2Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

seedJob:
  enabled: false
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  serviceAccountName: default
  wipeBeforeSeed: "true"
  manifestPath: /tmp/perf_seed_manifest.json
  manifestCopyTo: ""
  waitForFirestoreEmulator: false
  firestoreHostPort: ""
  googleCloudProject: ""
  firestoreDatabaseId: "tbd-firestore"
  image:
    repository: ghcr.io/tbd-htwg/backend/tripplanning-seed-job
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "2000m"
      memory: "1536Mi"
