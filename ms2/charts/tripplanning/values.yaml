global:
  nameOverride: ""
  fullnameOverride: ""
  namespace: ""
  imagePullSecrets: []
  gateway:
    name: "tripplanning-gateway"
    namespace: "gateway-system"
  hosts:
    api: "api.k8s.tbd-htwg.de"
  corsAllowedOrigins: "https://k8s.tbd-htwg.de"

services:
  apiRouter:
    name: api-router
    image:
      repository: nginx
      tag: 1.27-alpine
      pullPolicy: IfNotPresent
    port: 8088
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  trip:
    name: trip-service
    image:
      repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
      tag: latest
      pullPolicy: Always
    port: 8080
    replicas: 1
    resources:
      requests:
        cpu: "300m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    env:
      SPRING_PROFILES_ACTIVE: "k8s"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/tripplanning"
      SPRING_DATASOURCE_USERNAME: "tripplanning_app"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      ELASTICSEARCH_PROTOCOL: "http"
      ELASTICSEARCH_HOSTS: "elasticsearch:9200"
      HIBERNATE_SEARCH_BACKEND_VERSION: "opensearch:2.19"
      TRIPPLANNING_SEARCH_ELASTICSEARCH_INDEX_NAME: "tripentity"
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
      TRIPPLANNING_SOCIAL_SERVICE_URL: "http://social-service:8081"
      TRIPPLANNING_EXTERNAL_INFO_SERVICE_URL: "http://external-info-service:8082"
      TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "tbd-cloudappdev"
      CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
      GCP_STORAGE_BUCKET_NAME: "tbd-cloudappdev-images-bucket"
      GCP_IMPERSONATE_SERVICE_ACCOUNT: "tripplanning-image-url-sig@tbd-cloudappdev.iam.gserviceaccount.com"
    secretRefs:
      - trip-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    neg:
      enabled: true

  social:
    name: social-service
    image:
      repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
      tag: latest
      pullPolicy: Always
    port: 8081
    replicas: 1
    resources:
      requests:
        cpu: "200m"
        memory: "384Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"
    env:
      SPRING_PROFILES_ACTIVE: "cloud"
      SERVER_PORT: "8081"
      CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
      TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "tbd-cloudappdev"
      TRIPPLANNING_TRIP_SERVICE_URL: "http://trip-service:8080"
      GCP_FIRESTORE_DATABASE_ID: "tbd-firestore"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
    secretRefs:
      - social-service-secrets
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness

  externalInfo:
    name: external-info-service
    image:
      repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
      tag: latest
      pullPolicy: Always
    port: 8082
    replicas: 1
    resources:
      requests:
        cpu: "150m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      SERVER_PORT: "8082"
      CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
      SPRING_DATA_REDIS_HOST: "valkey"
      SPRING_DATA_REDIS_PORT: "6379"
    secretRefs:
      - external-info-service-secrets
    readinessPath: /actuator/health

routes:
  - path: /api/v2/comments
    service: social-service
    port: 8081
    pathType: PathPrefix
  - path: /api/v2/external
    service: external-info-service
    port: 8082
    pathType: PathPrefix
  - path: /api/search
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /api/v2/trips
    service: api-router
    port: 8088
    pathType: PathPrefix
  - path: /api/v2/users
    service: api-router
    port: 8088
    pathType: PathPrefix
  - path: /api/v2
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /actuator
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /swagger-ui
    service: trip-service
    port: 8080
    pathType: PathPrefix
  - path: /v3
    service: trip-service
    port: 8080
    pathType: PathPrefix

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

backingServices:
  postgres:
    enabled: true
    serviceName: postgres
    image: postgres:15-alpine
    database: tripplanning
    storageClassName: "standard"
    dataDir: "/var/lib/postgresql/data/pgdata"
    storageSize: 2Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    auth:
      username: tripplanning_app
      password: ""
      existingSecret: ""
      passwordKey: password
  valkey:
    enabled: true
    serviceName: valkey
    image: valkey/valkey:8-alpine
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "150m"
        memory: "256Mi"
  elasticsearch:
    enabled: true
    serviceName: elasticsearch
    image: opensearchproject/opensearch:2.19.0
    javaOpts: "-Xms512m -Xmx512m"
    storageClassName: "standard"
    storageSize: 2Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

seedJob:
  enabled: false
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  serviceAccountName: default
  wipeBeforeSeed: "true"
  manifestPath: /tmp/perf_seed_manifest.json
  manifestCopyTo: ""
  waitForFirestoreEmulator: false
  firestoreHostPort: ""
  googleCloudProject: "tbd-cloudappdev"
  firestoreDatabaseId: "tbd-firestore"
  image:
    repository: ghcr.io/tbd-htwg/backend/tripplanning-seed-job
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "2000m"
      memory: "1536Mi"
