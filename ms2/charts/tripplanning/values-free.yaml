global:
  tier: free
  tenantId: free
  identityPlatform:
    tenantId: ""
  storage:
    imagesPrefix: free
  frontend:
    bucketPrefix: free
  cache:
    keyPrefix: free

apiRouter:
  mode: free
  enforceKnownHosts: false
  loadBalancer:
    enabled: false

services:
  apiRouter:
    replicas: 1
  trip:
    replicas: 1
    resources:
      requests:
        cpu: "150m"
        memory: "768Mi"
      limits:
        cpu: "400m"
        memory: "1024Mi"
  social:
    replicas: 1
    resources:
      requests:
        cpu: "150m"
        memory: "768Mi"
      limits:
        cpu: "400m"
        memory: "768Mi"
  externalInfo:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "768Mi"
      limits:
        cpu: "300m"
        memory: "768Mi"

autoscaling:
  enabled: false
