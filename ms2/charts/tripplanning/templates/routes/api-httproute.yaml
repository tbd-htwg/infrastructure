apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: tripplanning-api
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
  hostnames:
    - {{ .Values.global.hosts.api | quote }}
  rules:
{{- range .Values.routes }}
    - matches:
        - path:
            type: {{ .pathType }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
