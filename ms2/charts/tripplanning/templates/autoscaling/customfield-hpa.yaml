{{- if and .Values.autoscaling.enabled .Values.services.customfield.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customfield-service
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: customfield-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customfield-service
  minReplicas: {{ include "tripplanning.customfieldAutoscalingMinReplicas" . }}
  maxReplicas: {{ include "tripplanning.customfieldAutoscalingMaxReplicas" . }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUpStabilizationSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
