{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trip-service
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: trip-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trip-service
  minReplicas: {{ include "tripplanning.tripAutoscalingMinReplicas" . }}
  maxReplicas: {{ include "tripplanning.tripAutoscalingMaxReplicas" . }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUpStabilizationSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ include "tripplanning.tripAutoscalingTargetCPU" . }}
{{- $memTarget := include "tripplanning.tripAutoscalingTargetMemory" . | int }}
{{- if gt $memTarget 0 }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $memTarget }}
{{- end }}
{{- end }}
