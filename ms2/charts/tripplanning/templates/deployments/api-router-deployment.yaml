{{- $rollingUpdate := default dict .Values.services.apiRouter.rollingUpdate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-router
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-router
spec:
  replicas: {{ .Values.services.apiRouter.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ default 0 $rollingUpdate.maxSurge }}
      maxUnavailable: {{ default 1 $rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api-router
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-router
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/api-router-config: {{ include (print $.Template.BasePath "/configmaps/api-router-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api-router
          image: "{{ .Values.services.apiRouter.image.repository }}:{{ .Values.services.apiRouter.image.tag }}"
          imagePullPolicy: {{ .Values.services.apiRouter.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.apiRouter.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.services.apiRouter.port }}
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.services.apiRouter.port }}
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.services.apiRouter.resources.requests.cpu }}
              memory: {{ .Values.services.apiRouter.resources.requests.memory }}
            limits:
              cpu: {{ .Values.services.apiRouter.resources.limits.cpu }}
              memory: {{ .Values.services.apiRouter.resources.limits.memory }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: api-router-config
