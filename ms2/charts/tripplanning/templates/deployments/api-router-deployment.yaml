{{- $rollingUpdate := default dict .Values.services.apiRouter.rollingUpdate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-router
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-router
spec:
  replicas: {{ .Values.services.apiRouter.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{- if hasKey $rollingUpdate "maxSurge" }} {{ $rollingUpdate.maxSurge }}{{- else }} 1{{- end }}
      maxUnavailable: {{- if hasKey $rollingUpdate "maxUnavailable" }} {{ $rollingUpdate.maxUnavailable }}{{- else }} 0{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api-router
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-router
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/api-router-config: {{ include (print $.Template.BasePath "/configmaps/api-router-configmap.yaml") . | sha256sum }}
        checksum/deployment-info: {{ include (print $.Template.BasePath "/configmaps/deployment-info-configmap.yaml") . | sha256sum }}
        traffic.sidecar.istio.io/excludeOutboundIPRanges: 169.254.169.254/32
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,9200"
    spec:
      containers:
        - name: api-router
          image: "{{ .Values.services.apiRouter.image.repository }}:{{ .Values.services.apiRouter.image.tag }}"
          imagePullPolicy: {{ .Values.services.apiRouter.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.apiRouter.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.services.apiRouter.port }}
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.services.apiRouter.port }}
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.services.apiRouter.resources.requests.cpu }}
              memory: {{ .Values.services.apiRouter.resources.requests.memory }}
            limits:
              cpu: {{ .Values.services.apiRouter.resources.limits.cpu }}
              memory: {{ .Values.services.apiRouter.resources.limits.memory }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: deployment-info
              mountPath: /usr/share/nginx/html/deployment-info-default
            - name: live-deployment-info
              mountPath: /usr/share/nginx/html/deployment-info-live
      volumes:
        - name: config
          configMap:
            name: api-router-config
        - name: deployment-info
          configMap:
            name: api-router-deployment-info
        - name: live-deployment-info
          configMap:
            name: api-router-live-deployment-info
            optional: true
