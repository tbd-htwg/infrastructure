{{- $rollingUpdate := default dict .Values.services.trip.rollingUpdate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: trip-service
spec:
  replicas: {{ include "tripplanning.tripReplicas" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ default 0 $rollingUpdate.maxSurge }}
      maxUnavailable: {{ default 1 $rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: trip-service
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/trip-config: {{ include (print $.Template.BasePath "/configmaps/trip-configmap.yaml") . | sha256sum }}
        traffic.sidecar.istio.io/excludeOutboundIPRanges: 169.254.169.254/32
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,9200"
      labels:
        app.kubernetes.io/component: trip-service
        app.kubernetes.io/name: {{ include "tripplanning.name" . }}
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: tripplanning
        tripplanning.htwg.dev/tier: {{ .Values.global.tier }}
        {{- if .Values.global.tenantId }}
        tripplanning.htwg.dev/tenant-id: {{ .Values.global.tenantId }}
        {{- end }}
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.services.trip.terminationGracePeriodSeconds | default 30 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if or .Values.services.trip.bootstrap.waitForValkey .Values.services.trip.bootstrap.waitForSearch }}
      initContainers:
{{- if .Values.services.trip.bootstrap.waitForValkey }}
        {{- include "tripplanning.waitForValkey" . | nindent 8 }}
{{- end }}
{{- if .Values.services.trip.bootstrap.waitForSearch }}
        {{- include "tripplanning.waitForSearch" . | nindent 8 }}
{{- end }}
      {{- end }}
      containers:
        - name: trip-service
          image: "{{ .Values.services.trip.image.repository }}:{{ .Values.services.trip.image.tag }}"
          imagePullPolicy: {{ .Values.services.trip.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.trip.port }}
          envFrom:
            - configMapRef:
                name: trip-service-config
{{- range .Values.services.trip.secretRefs }}
            - secretRef:
                name: {{ . }}
{{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.services.trip.livenessPath }}
              port: {{ .Values.services.trip.port }}
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ .Values.services.trip.readinessPath }}
              port: {{ .Values.services.trip.port }}
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: {{ .Values.services.trip.livenessPath }}
              port: {{ .Values.services.trip.port }}
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.services.trip.resources.requests.cpu }}
              memory: {{ .Values.services.trip.resources.requests.memory }}
            limits:
              cpu: {{ .Values.services.trip.resources.limits.cpu }}
              memory: {{ .Values.services.trip.resources.limits.memory }}
{{- if .Values.global.cloudSql.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.global.cloudSql.proxyImage | quote }}
          args:
            - "--private-ip"
            - "--port={{ .Values.global.cloudSql.proxyPort }}"
            - {{ .Values.global.cloudSql.connectionName | quote }}
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
