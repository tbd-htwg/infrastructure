apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: social-service
spec:
  replicas: {{ .Values.services.social.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: social-service
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: social-service
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: social-service
          image: "{{ .Values.services.social.image.repository }}:{{ .Values.services.social.image.tag }}"
          imagePullPolicy: {{ .Values.services.social.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.social.port }}
          envFrom:
            - configMapRef:
                name: social-service-config
{{- range .Values.services.social.secretRefs }}
            - secretRef:
                name: {{ . }}
{{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.services.social.readinessPath }}
              port: {{ .Values.services.social.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.services.social.livenessPath }}
              port: {{ .Values.services.social.port }}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.services.social.resources.requests.cpu }}
              memory: {{ .Values.services.social.resources.requests.memory }}
            limits:
              cpu: {{ .Values.services.social.resources.limits.cpu }}
              memory: {{ .Values.services.social.resources.limits.memory }}
