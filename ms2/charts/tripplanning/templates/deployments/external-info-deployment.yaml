apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-info-service
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-info-service
spec:
  replicas: {{ include "tripplanning.externalInfoReplicas" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.services.externalInfo.rollingUpdate.maxSurge | default 0 }}
      maxUnavailable: {{ .Values.services.externalInfo.rollingUpdate.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: external-info-service
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: external-info-service
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if .Values.services.externalInfo.bootstrap.waitForValkey }}
      initContainers:
        {{- include "tripplanning.waitForValkey" . | nindent 8 }}
      {{- end }}
      containers:
        - name: external-info-service
          image: "{{ .Values.services.externalInfo.image.repository }}:{{ .Values.services.externalInfo.image.tag }}"
          imagePullPolicy: {{ .Values.services.externalInfo.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.externalInfo.port }}
          envFrom:
            - configMapRef:
                name: external-info-service-config
{{- range .Values.services.externalInfo.secretRefs }}
            - secretRef:
                name: {{ . }}
{{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.services.externalInfo.readinessPath }}
              port: {{ .Values.services.externalInfo.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.services.externalInfo.livenessPath }}
              port: {{ .Values.services.externalInfo.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.services.externalInfo.resources.requests.cpu }}
              memory: {{ .Values.services.externalInfo.resources.requests.memory }}
            limits:
              cpu: {{ .Values.services.externalInfo.resources.limits.cpu }}
              memory: {{ .Values.services.externalInfo.resources.limits.memory }}
