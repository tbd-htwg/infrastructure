{{- $rollingUpdate := default dict .Values.services.externalInfo.rollingUpdate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-info-service
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-info-service
spec:
  replicas: {{ include "tripplanning.externalInfoReplicas" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ default 0 $rollingUpdate.maxSurge }}
      maxUnavailable: {{ default 1 $rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: external-info-service
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/external-info-config: {{ include (print $.Template.BasePath "/configmaps/external-info-configmap.yaml") . | sha256sum }}
        traffic.sidecar.istio.io/excludeOutboundIPRanges: 169.254.169.254/32
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379,9200"
      labels:
        app.kubernetes.io/component: external-info-service
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if .Values.services.externalInfo.bootstrap.waitForValkey }}
      initContainers:
        {{- include "tripplanning.waitForValkey" . | nindent 8 }}
      {{- end }}
      containers:
        - name: external-info-service
          image: "{{ .Values.services.externalInfo.image.repository }}:{{ .Values.services.externalInfo.image.tag }}"
          imagePullPolicy: {{ .Values.services.externalInfo.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.externalInfo.port }}
          envFrom:
            - configMapRef:
                name: external-info-service-config
{{- range .Values.services.externalInfo.secretRefs }}
            - secretRef:
                name: {{ . }}
{{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.services.externalInfo.livenessPath }}
              port: {{ .Values.services.externalInfo.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .Values.services.externalInfo.readinessPath }}
              port: {{ .Values.services.externalInfo.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ .Values.services.externalInfo.livenessPath }}
              port: {{ .Values.services.externalInfo.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.services.externalInfo.resources.requests.cpu }}
              memory: {{ .Values.services.externalInfo.resources.requests.memory }}
            limits:
              cpu: {{ .Values.services.externalInfo.resources.limits.cpu }}
              memory: {{ .Values.services.externalInfo.resources.limits.memory }}
