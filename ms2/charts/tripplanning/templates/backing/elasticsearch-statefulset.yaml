{{- if .Values.backingServices.elasticsearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  serviceName: {{ .Values.backingServices.elasticsearch.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: elasticsearch
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: elasticsearch
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.backingServices.elasticsearch.image }}
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.backingServices.elasticsearch.javaOpts | quote }}
          resources:
            requests:
              cpu: {{ .Values.backingServices.elasticsearch.resources.requests.cpu }}
              memory: {{ .Values.backingServices.elasticsearch.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backingServices.elasticsearch.resources.limits.cpu }}
              memory: {{ .Values.backingServices.elasticsearch.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.backingServices.elasticsearch.storageClassName }}
        storageClassName: {{ .Values.backingServices.elasticsearch.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.backingServices.elasticsearch.storageSize }}
{{- end }}
