{{- if .Values.backingServices.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Values.backingServices.postgres.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: postgres
          image: {{ .Values.backingServices.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.backingServices.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.backingServices.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.backingServices.postgres.auth.existingSecret }}{{ .Values.backingServices.postgres.auth.existingSecret }}{{ else }}postgres-secret{{ end }}
                  key: {{ .Values.backingServices.postgres.auth.passwordKey | quote }}
            - name: PGDATA
              value: {{ .Values.backingServices.postgres.dataDir | quote }}
          {{- with .Values.backingServices.postgres.extraConfigArgs }}
          args:
            - postgres
            {{- range . }}
            - -c
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.backingServices.postgres.resources.requests.cpu }}
              memory: {{ .Values.backingServices.postgres.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backingServices.postgres.resources.limits.cpu }}
              memory: {{ .Values.backingServices.postgres.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.backingServices.postgres.storageClassName }}
        storageClassName: {{ .Values.backingServices.postgres.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.backingServices.postgres.storageSize }}
{{- end }}
