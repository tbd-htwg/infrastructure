{{- if .Values.backingServices.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backingServices.postgres.serviceName }}
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
    {{- include "tripplanning.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
