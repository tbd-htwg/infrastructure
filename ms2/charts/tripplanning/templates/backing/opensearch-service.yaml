{{- if .Values.backingServices.opensearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backingServices.opensearch.serviceName }}
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  selector:
    app.kubernetes.io/component: opensearch
    {{- include "tripplanning.selectorLabels" . | nindent 4 }}
  ports:
    - port: 9200
      targetPort: 9200
{{- end }}
