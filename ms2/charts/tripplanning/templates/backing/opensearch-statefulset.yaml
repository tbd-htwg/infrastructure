{{- if .Values.backingServices.opensearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.backingServices.opensearch.resourceName }}
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ .Values.backingServices.opensearch.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: opensearch
      {{- include "tripplanning.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: opensearch
        {{- include "tripplanning.selectorLabels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: opensearch
          image: {{ .Values.backingServices.opensearch.image }}
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.backingServices.opensearch.javaOpts | quote }}
          resources:
            requests:
              cpu: {{ .Values.backingServices.opensearch.resources.requests.cpu }}
              memory: {{ .Values.backingServices.opensearch.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backingServices.opensearch.resources.limits.cpu }}
              memory: {{ .Values.backingServices.opensearch.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
{{- if .Values.backingServices.opensearch.existingClaim }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.backingServices.opensearch.existingClaim }}
{{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.backingServices.opensearch.storageClassName }}
        storageClassName: {{ .Values.backingServices.opensearch.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.backingServices.opensearch.storageSize }}
{{- end }}
{{- end }}
