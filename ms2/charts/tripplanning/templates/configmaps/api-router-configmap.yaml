apiVersion: v1
kind: ConfigMap
metadata:
  name: api-router-config
  labels:
    {{- include "tripplanning.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-router
data:
  default.conf: |
    map $host $tripplanning_tenant_id {
      default {{ .Values.global.tenantId | quote }};
{{- range $tenant := .Values.apiRouter.tenants }}
{{- range $tenant.hostnames }}
      {{ . | quote }} {{ $tenant.tenantId | quote }};
{{- end }}
{{- end }}
{{- range .Values.global.hostnames }}
      {{ . | quote }} {{ $.Values.global.tenantId | quote }};
{{- end }}
    }

    map $host $tripplanning_identity_tenant_id {
      default {{ .Values.global.identityPlatform.tenantId | quote }};
{{- range $tenant := .Values.apiRouter.tenants }}
{{- range $tenant.hostnames }}
      {{ . | quote }} {{ $tenant.identityPlatformTenantId | quote }};
{{- end }}
{{- end }}
{{- range .Values.global.hostnames }}
      {{ . | quote }} {{ $.Values.global.identityPlatform.tenantId | quote }};
{{- end }}
    }

    server {
      listen {{ .Values.services.apiRouter.port }};
      server_name _;
      access_log /dev/stdout;
      error_log /dev/stderr warn;

      location = /healthz {
        access_log off;
        add_header X-Api-Router "tripplanning" always;
        return 200 "ok\n";
      }

{{- if .Values.apiRouter.enforceKnownHosts }}
      if ($tripplanning_tenant_id = "") {
        return 404;
      }
{{- end }}

      location = /api/v2/trips/search/countLikes {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://social-service:{{ .Values.services.social.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location ~ ^/api/v2/trips/[^/]+/(community|comments|liked-by-current-user|like)$ {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://social-service:{{ .Values.services.social.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      # Collection POST (text/uri-list body) — distinct from GET list on trip-service.
      location ~ ^/api/v2/users/[^/]+/likedTrips$ {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://social-service:{{ .Values.services.social.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location ~ ^/api/v2/users/[^/]+/likedTrips/[^/]+$ {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://social-service:{{ .Values.services.social.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location /api/v2/comments {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://social-service:{{ .Values.services.social.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location /api/v2/external {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://external-info-service:{{ .Values.services.externalInfo.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

{{- if .Values.apiRouter.platform.enabled }}
      location /api/v2/auth {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://{{ .Values.apiRouter.platform.serviceName }}.{{ .Values.apiRouter.platform.namespace }}.svc.cluster.local:{{ .Values.apiRouter.platform.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location /api/v2/admin {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://{{ .Values.apiRouter.platform.serviceName }}.{{ .Values.apiRouter.platform.namespace }}.svc.cluster.local:{{ .Values.apiRouter.platform.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location /api/v2/tenants {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://{{ .Values.apiRouter.platform.serviceName }}.{{ .Values.apiRouter.platform.namespace }}.svc.cluster.local:{{ .Values.apiRouter.platform.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location /api/v2/platform {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://{{ .Values.apiRouter.platform.serviceName }}.{{ .Values.apiRouter.platform.namespace }}.svc.cluster.local:{{ .Values.apiRouter.platform.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

{{- end }}
      location /api/search {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://trip-service:{{ .Values.services.trip.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }

      location / {
        add_header X-Api-Router "tripplanning" always;
        proxy_pass http://trip-service:{{ .Values.services.trip.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header {{ .Values.apiRouter.tenantHeader }} $tripplanning_tenant_id;
        proxy_set_header {{ .Values.apiRouter.identityTenantHeader }} $tripplanning_identity_tenant_id;
      }
    }
