apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-workloads
  namespace: flux-system
spec:
  interval: 10m
  path: ./ms2/gitops/platform/workloads
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: environment-config
  dependsOn:
    - name: platform-config
