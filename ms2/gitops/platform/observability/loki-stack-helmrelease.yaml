apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: observability
spec:
  interval: 10m
  chart:
    spec:
      chart: loki-stack
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    grafana:
      enabled: false
    prometheus:
      enabled: false
    loki:
      enabled: true
    promtail:
      enabled: true
