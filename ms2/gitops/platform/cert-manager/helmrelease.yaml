apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    installCRDs: true
    global:
      leaderElection:
        namespace: cert-manager
    leaderElection:
      namespace: cert-manager
    extraArgs:
      - --leader-election-namespace=cert-manager
    cainjector:
      leaderElection:
        namespace: cert-manager
      extraArgs:
        - --leader-election-namespace=cert-manager
    webhook:
      leaderElection:
        namespace: cert-manager
      extraArgs:
        - --leader-election-namespace=cert-manager
    serviceAccount:
      create: true
      name: cert-manager
      annotations:
        iam.gke.io/gcp-service-account: workload@tbd-cloudappdev.iam.gserviceaccount.com
