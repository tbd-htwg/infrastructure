apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    installCRDs: true
    serviceAccount:
      create: true
      name: cert-manager
      annotations:
        iam.gke.io/gcp-service-account: workload@milestone2-tbd-cad.iam.gserviceaccount.com
