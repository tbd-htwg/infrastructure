apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-service
  namespace: tripplanning-system
  labels:
    app.kubernetes.io/name: platform-service
    app.kubernetes.io/component: platform-service
    app.kubernetes.io/part-of: tripplanning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-service
      app.kubernetes.io/component: platform-service
  template:
    metadata:
      annotations:
        traffic.sidecar.istio.io/excludeOutboundIPRanges: 169.254.169.254/32
      labels:
        app.kubernetes.io/name: platform-service
        app.kubernetes.io/component: platform-service
        app.kubernetes.io/part-of: tripplanning
    spec:
      serviceAccountName: platform-service
      containers:
        - name: platform-service
          image: ghcr.io/tbd-htwg/backend/tripplanning-platform-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: platform-service-config
            - secretRef:
                name: platform-service-secrets
          env:
            - name: TRIPPLANNING_PLATFORM_GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
            - name: TRIPPLANNING_PLATFORM_GITHUB_DISPATCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-github-dispatch
                  key: TRIPPLANNING_PLATFORM_GITHUB_DISPATCH_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 35
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
