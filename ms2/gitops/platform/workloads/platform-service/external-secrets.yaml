apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: tripplanning-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: tripplanning-ghcr-pull-dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-service-secrets
  namespace: tripplanning-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: platform-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: tripplanning-platform-db-password
    - secretKey: TRIPPLANNING_AUTH_JWT_SECRET
      remoteRef:
        key: tripplanning-jwt-secret
    - secretKey: TRIPPLANNING_INTERNAL_SECRET
      remoteRef:
        key: tripplanning-internal-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-github-dispatch
  namespace: tripplanning-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: platform-github-dispatch
    creationPolicy: Owner
  data:
    - secretKey: TRIPPLANNING_PLATFORM_GITHUB_DISPATCH_TOKEN
      remoteRef:
        key: tripplanning-platform-github-dispatch-token
