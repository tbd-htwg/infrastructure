apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: tripplanning-trip-service
  labels:
    app.kubernetes.io/name: tripplanning-trip-service
    app.kubernetes.io/part-of: tripplanning
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - trip-service
  endpoints:
    - port: 8080
      path: /actuator/prometheus
      interval: 30s
---
