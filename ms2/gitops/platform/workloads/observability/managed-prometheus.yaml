  labels:
    app.kubernetes.io/name: tripplanning-mesh-proxies
    app.kubernetes.io/part-of: tripplanning
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: Exists
  endpoints:
