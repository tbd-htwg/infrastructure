apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-service-config
  namespace: tripplanning-system
  labels:
    app.kubernetes.io/name: platform-service
    app.kubernetes.io/part-of: tripplanning
data:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
  SERVER_PORT: "8083"
  SPRING_PROFILES_ACTIVE: "k8s"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_DATASOURCE_URL: "jdbc:postgresql:///tripplanning_platform?cloudSqlInstance=tbd-cloudappdev:europe-west1:tripplanning-platform&socketFactory=com.google.cloud.sql.postgres.SocketFactory"
  SPRING_DATASOURCE_USERNAME: "tripplanning_platform"
  CORS_ALLOWED_ORIGINS: "https://k8s.tbd-htwg.de"
  TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "tbd-cloudappdev"
  TRIPPLANNING_PLATFORM_HOST_BASE: "k8s.tbd-htwg.de"
  TRIPPLANNING_PLATFORM_ENTERPRISE_HOST_BASE: "enterprise.k8s.tbd-htwg.de"
  TRIPPLANNING_PLATFORM_BOOTSTRAP_ADMIN_EMAIL: "admin@platform.demo"
  TRIPPLANNING_PLATFORM_USE_STUBS: "false"
  TRIPPLANNING_PLATFORM_GITHUB_DISPATCH_URL: "https://api.github.com/repos/tbd-htwg/infrastructure/dispatches"
  TRIPPLANNING_TRIP_SERVICE_URL: "http://trip-service.tripplanning-free.svc.cluster.local:8080"
