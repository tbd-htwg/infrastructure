apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: tripplanning-gateway
  namespace: gateway-system
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: tripplanning-api-gateway-ip
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "api.k8s.tbd-htwg.de"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: api-tls
