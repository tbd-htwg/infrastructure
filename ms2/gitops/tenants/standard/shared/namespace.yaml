apiVersion: v1
kind: Namespace
metadata:
  name: tripplanning-standard
  labels:
    app.kubernetes.io/name: tripplanning
    tier: standard
    tripplanning.htwg.dev/tier: standard
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tripplanning-standard-quota
  namespace: tripplanning-standard
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "32"
    limits.memory: 48Gi
    pods: "80"
    persistentvolumeclaims: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tripplanning-standard-limits
  namespace: tripplanning-standard
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "1000m"
        memory: "1Gi"
