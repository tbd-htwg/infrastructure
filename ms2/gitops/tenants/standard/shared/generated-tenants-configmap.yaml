apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-standard-generated-tenants
  namespace: tripplanning-standard
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    apiRouter:
      tenants:
      - tenantId: finalstd
        identityPlatformTenantId: finalstd-v1urj
        hostnames:
        - finalstd.k8s.tbd-htwg.de
      - tenantId: tripper-ultimate
        identityPlatformTenantId: tripper-ultimate-eqeid
        hostnames:
        - tripper-ultimate.k8s.tbd-htwg.de
      - tenantId: xtripmanager
        identityPlatformTenantId: xtripmanager-j058b
        hostnames:
        - xtripmanager.k8s.tbd-htwg.de
      loadBalancer:
        ip: 34.79.13.109
    global:
      cloudSql:
        enabled: true
        connectionName: tbd-cloudappdev:europe-west1:tripplanning-standard
        databaseName: tripplanning_std_finalstd
        userName: tripplanning_app_finalstd
      search:
        indexName: tripentity-finalstd
      cache:
        keyPrefix: std:finalstd
      storage:
        imagesPrefix: standard/finalstd
    services:
      trip:
        secretRefs:
        - trip-service-secrets
        - trip-service-db-secrets
        env:
          CORS_ALLOWED_ORIGINS: https://k8s.tbd-htwg.de,https://finalstd.k8s.tbd-htwg.de,https://tripper-ultimate.k8s.tbd-htwg.de,https://xtripmanager.k8s.tbd-htwg.de
          TRIPPLANNING_TENANT_DATASOURCE_ROUTING: 'true'
          TRIPPLANNING_PLATFORM_BASE_URL: http://platform-service.tripplanning-system:8083
      social:
        env:
          CORS_ALLOWED_ORIGINS: https://k8s.tbd-htwg.de,https://finalstd.k8s.tbd-htwg.de,https://tripper-ultimate.k8s.tbd-htwg.de,https://xtripmanager.k8s.tbd-htwg.de
      externalInfo:
        env:
          CORS_ALLOWED_ORIGINS: https://k8s.tbd-htwg.de,https://finalstd.k8s.tbd-htwg.de,https://tripper-ultimate.k8s.tbd-htwg.de,https://xtripmanager.k8s.tbd-htwg.de
