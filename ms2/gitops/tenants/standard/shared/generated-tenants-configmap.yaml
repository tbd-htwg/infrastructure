apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-standard-generated-tenants
  namespace: tripplanning-standard
data:
  values.yaml: |
    apiRouter:
      tenants:
      - tenantId: blue5
        identityPlatformTenantId: blue5-e7krz
        hostnames:
        - blue5.k8s.tbd-htwg.de
      - tenantId: bluex1
        identityPlatformTenantId: bluex1-df3eh
        hostnames:
        - bluex1.k8s.tbd-htwg.de
      loadBalancer:
        ip: 34.52.217.31
    global:
      cloudSql:
        enabled: true
        connectionName: tbd-cloudappdev:europe-west1:tripplanning-standard
        databaseName: tripplanning_std_blue5
        userName: tripplanning_app_blue5
    services:
      trip:
        secretRefs:
        - trip-service-secrets
        - trip-service-db-secrets
        env:
          CORS_ALLOWED_ORIGINS: https://k8s.tbd-htwg.de,https://blue5.k8s.tbd-htwg.de,https://bluex1.k8s.tbd-htwg.de
          TRIPPLANNING_TENANT_DATASOURCE_ROUTING: 'false'
          TRIPPLANNING_PLATFORM_BASE_URL: http://platform-service.tripplanning-system:8083
      social:
        env:
          CORS_ALLOWED_ORIGINS: https://k8s.tbd-htwg.de,https://blue5.k8s.tbd-htwg.de,https://bluex1.k8s.tbd-htwg.de
      externalInfo:
        env:
          CORS_ALLOWED_ORIGINS: https://k8s.tbd-htwg.de,https://blue5.k8s.tbd-htwg.de,https://bluex1.k8s.tbd-htwg.de
