apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-standard-values
  namespace: tripplanning-standard
data:
  values.yaml: |
    global:
      tier: standard
      tenantId: standard-shared
      imagePullSecrets:
        - ghcr-pull
      hostnames: []
      frontend:
        bucketName: tbd-cloudappdev-frontend-bucket
        bucketPrefix: standard
        brandName: TripPlanning
        colorScheme: default
        brandIcon: ""
      storage:
        imagesBucketName: tbd-cloudappdev-images-bucket
        imagesPrefix: standard
      search:
        indexName: tripentity-standard
      cache:
        keyPrefix: std
      cloudSql:
        enabled: true
        connectionName: tbd-cloudappdev:europe-west1:tripplanning-standard
        databaseName: tripplanning_std_test03
        userName: tripplanning_app_test03
    apiRouter:
      mode: standard
      enforceKnownHosts: true
      tenants: []
      loadBalancer:
        enabled: true
        # Replace with Terraform output standard_load_balancer_ip.
        ip: ""
        externalTrafficPolicy: Cluster
    services:
      apiRouter:
        replicas: 1
      trip:
        replicas: 1
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"
        env:
          SPRING_DATA_REDIS_HOST: valkey
          SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_TENANT_REGISTRY_MODE: standard
          TRIPPLANNING_TENANT_DATASOURCE_ROUTING: "false"
          TRIPPLANNING_PLATFORM_BASE_URL: "http://platform-service.tripplanning-system:8083"
      social:
        replicas: 1
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
          SPRING_DATA_REDIS_HOST: valkey
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      externalInfo:
        replicas: 1
        resources:
          requests:
            cpu: "100m"
            memory: "192Mi"
          limits:
            cpu: "500m"
            memory: "384Mi"
        env:
          SPRING_DATA_REDIS_HOST: valkey
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    backingServices:
      postgres:
        enabled: false
      valkey:
        enabled: true
        serviceName: valkey
        image: valkey/valkey:8-alpine
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      elasticsearch:
        enabled: true
        image: opensearchproject/opensearch:2.19.0
        javaOpts: "-Xms256m -Xmx256m"
        storageClassName: "standard-hdd-wffc"
        storageSize: 2Gi
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "750m"
            memory: "1Gi"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70
