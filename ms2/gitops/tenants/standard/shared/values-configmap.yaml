apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-standard-values
  namespace: tripplanning-standard
data:
  values.yaml: |
    global:
      tier: standard
      tenantId: standard-shared
      deployment:
        environment: prod
      imagePullSecrets:
        - ghcr-pull
      hostnames: []
      frontend:
        bucketName: "${FRONTEND_BUCKET}"
        bucketPrefix: standard
        brandName: TripPlanning
        colorScheme: default
        brandIcon: ""
      storage:
        imagesBucketName: "${IMAGES_BUCKET}"
        imagesPrefix: standard
      search:
        indexName: tripentity-standard
      cache:
        keyPrefix: std
    apiRouter:
      mode: standard
      enforceKnownHosts: true
      tenants: []
      loadBalancer:
        enabled: true
        # Replace with Terraform output standard_load_balancer_ip.
        ip: ""
        externalTrafficPolicy: Cluster
    services:
      apiRouter:
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      trip:
        image:
          tag: prod
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"
        env:
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "${GCP_PROJECT_ID}"
          GCP_IMPERSONATE_SERVICE_ACCOUNT: "tripplanning-image-url-sig@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          SPRING_DATA_REDIS_HOST: valkey
          SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_TENANT_REGISTRY_MODE: standard
        bootstrap:
          waitForValkey: true
          waitForSearch: true
      social:
        image:
          tag: prod
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "${GCP_PROJECT_ID}"
          GCP_FIRESTORE_DATABASE_ID: "${FIRESTORE_DATABASE_ID}"
          SPRING_DATA_REDIS_HOST: valkey
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      externalInfo:
        image:
          tag: prod
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        resources:
          requests:
            cpu: "100m"
            memory: "192Mi"
          limits:
            cpu: "500m"
            memory: "384Mi"
        env:
          SPRING_DATA_REDIS_HOST: valkey
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    backingServices:
      postgres:
        enabled: false
      valkey:
        enabled: true
        serviceName: valkey
        image: valkey/valkey:8-alpine
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      opensearch:
        enabled: true
        existingClaim: ""
        image: opensearchproject/opensearch:2.19.0
        javaOpts: "-Xms192m -Xmx192m"
        storageClassName: "standard-hdd-wffc"
        storageSize: 2Gi
        resources:
          requests:
            cpu: "100m"
            memory: "384Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70
