apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tripplanning-ent-blueent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: tripplanning-ent-blueent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-service
  namespace: tripplanning-ent-blueent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: trip-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tripplanning-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-service
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-router-ingress
  namespace: tripplanning-ent-blueent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api-router
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8088
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-managed-prometheus
  namespace: tripplanning-ent-blueent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
      ports:
        - protocol: TCP
          port: 15020
