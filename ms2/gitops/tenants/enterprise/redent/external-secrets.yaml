apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: tripplanning-ent-redent
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ .dockerconfigjson }}'
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: tripplanning-ghcr-pull-dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trip-service-secrets
  namespace: tripplanning-ent-redent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: trip-service-secrets
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: tripplanning-enterprise-redent-db-password
    - secretKey: TRIPPLANNING_AUTH_JWT_SECRET
      remoteRef:
        key: tripplanning-jwt-secret
    - secretKey: TRIPPLANNING_INTERNAL_SECRET
      remoteRef:
        key: tripplanning-internal-secret
---
