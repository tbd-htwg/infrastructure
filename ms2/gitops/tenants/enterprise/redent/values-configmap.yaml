apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-enterprise-redent-values
  namespace: tripplanning-ent-redent
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    global:
      tier: enterprise
      tenantId: redent
      hostnames:
      - redent.enterprise.k8s.tbd-htwg.de
      identityPlatform:
        tenantId: redent-iw5b2
      frontend:
        bucketName: tbd-cloudappdev-frontend-bucket
        bucketPrefix: enterprise/redent
        brandName: Red Enterprise
        colorScheme: default
        brandIcon: assets/brand-icon.png
      storage:
        imagesBucketName: tbd-cloudappdev-redent-images-bucket
        imagesPrefix: ''
      search:
        indexName: tripentity-redent
      cache:
        keyPrefix: ent:redent
      cloudSql:
        enabled: true
        connectionName: tbd-cloudappdev:europe-west1:tripplanning-ent-redent
        databaseName: tripplanning
        userName: tripplanning_app
      imagePullSecrets:
      - ghcr-pull
    apiRouter:
      mode: enterprise
      enforceKnownHosts: true
      tenants:
      - tenantId: redent
        identityPlatformTenantId: redent-iw5b2
        hostnames:
        - redent.enterprise.k8s.tbd-htwg.de
      loadBalancer:
        enabled: true
        ip: 34.156.211.179
        externalTrafficPolicy: Cluster
    services:
      apiRouter:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      trip:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: 600m
            memory: 768Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        env:
          CORS_ALLOWED_ORIGINS: https://redent.enterprise.k8s.tbd-htwg.de
          ELASTICSEARCH_HOSTS: opensearch-redent:9200
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: tbd-cloudappdev
          GCP_IMPERSONATE_SERVICE_ACCOUNT: tripplanning-image-url-sig@tbd-cloudappdev.iam.gserviceaccount.com
          TRIPPLANNING_PLATFORM_BASE_URL: http://platform-service.tripplanning-system:8083
        bootstrap:
          waitForValkey: true
          waitForSearch: true
      social:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: 750m
            memory: 768Mi
        env:
          CORS_ALLOWED_ORIGINS: https://redent.enterprise.k8s.tbd-htwg.de
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: tbd-cloudappdev
          SPRING_DATA_REDIS_HOST: valkey
        bootstrap:
          waitForValkey: true
      externalInfo:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
          CORS_ALLOWED_ORIGINS: https://redent.enterprise.k8s.tbd-htwg.de
          SPRING_DATA_REDIS_HOST: valkey
        bootstrap:
          waitForValkey: true
      customfield:
        enabled: true
        port: 8084
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-customfield-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
          SPRING_PROFILES_ACTIVE: cloud
          SERVER_PORT: '8084'
          CORS_ALLOWED_ORIGINS: https://redent.enterprise.k8s.tbd-htwg.de
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: tbd-cloudappdev
          TRIPPLANNING_TRIP_SERVICE_URL: http://trip-service:8080
          GCP_FIRESTORE_DATABASE_ID: (default)-redent
        secretRefs:
        - customfield-service-secrets
        livenessPath: /actuator/health/liveness
        readinessPath: /actuator/health/readiness
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      scaleUpStabilizationSeconds: 30
      scaleDownStabilizationSeconds: 300
      trip:
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 0
      social:
        minReplicas: 1
        maxReplicas: 2
      externalInfo:
        minReplicas: 1
        maxReplicas: 2
      customfield:
        minReplicas: 1
        maxReplicas: 2
    backingServices:
      postgres:
        enabled: false
      opensearch:
        enabled: true
        serviceName: opensearch-redent
        javaOpts: -Xms384m -Xmx384m
        storageSize: 2Gi
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
      valkey:
        enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
