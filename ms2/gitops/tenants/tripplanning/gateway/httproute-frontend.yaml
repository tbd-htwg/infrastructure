# Hostname k8s.tbd-htwg.de → nginx serving assets from gs://<project>-frontend-bucket
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tripplanning-frontend
spec:
  parentRefs:
    - name: tripplanning-api
      namespace: tripplanning
      sectionName: http-frontend
    - name: tripplanning-api
      namespace: tripplanning
      sectionName: https-frontend
  hostnames:
    - k8s.tbd-htwg.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
