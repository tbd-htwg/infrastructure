# HTTP listeners only at first deploy (Gateway programs before TLS secret exists).
# After cert-manager issues tripplanning-api-tls, dev-lifecycle.sh setup-tls applies gateway-https.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tripplanning-api
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http-api
      protocol: HTTP
      port: 80
      hostname: api.k8s.tbd-htwg.de
    - name: http-social
      protocol: HTTP
      port: 80
      hostname: social.api.k8s.tbd-htwg.de
    - name: http-frontend
      protocol: HTTP
      port: 80
      hostname: k8s.tbd-htwg.de
