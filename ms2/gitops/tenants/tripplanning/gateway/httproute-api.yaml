# GKE Gateway: PathPrefix, Exact, and RegularExpression (when supported by the controller).
# Rule order: first match wins. Social/external paths before trip catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tripplanning-api
spec:
  parentRefs:
    - name: tripplanning-api
      namespace: tripplanning
      sectionName: http-api
    - name: tripplanning-api
      namespace: tripplanning
      sectionName: https-api
  hostnames:
    - api.k8s.tbd-htwg.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/comments
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/trips/search/countLikes
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /api/v2/trips/[^/]+/community
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /api/v2/trips/[^/]+/comments
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /api/v2/trips/[^/]+/liked-by-current-user
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /api/v2/trips/[^/]+/like
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: RegularExpression
            value: /api/v2/users/[^/]+/likedTrips/[^/]+
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/external
      backendRefs:
        - name: external-info-service
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/search
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /actuator
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /swagger-ui
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v3
      backendRefs:
        - name: trip-service
          port: 8080
