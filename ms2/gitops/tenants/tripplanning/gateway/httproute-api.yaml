# GKE Gateway (gke-l7-global-external-managed) supports PathPrefix and Exact only — not RegularExpression.
# Rule order: first match wins. Social-specific paths before trip catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tripplanning-api
spec:
  parentRefs:
    - name: tripplanning-api
      namespace: tripplanning
      sectionName: http-api
    - name: tripplanning-api
      namespace: tripplanning
      sectionName: https-api
  hostnames:
    - api.k8s.tbd-htwg.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/comments
      backendRefs:
        - name: social-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/trips/search/countLikes
      backendRefs:
        - name: social-service
          port: 8080
    # /api/v2/users/* likedTrips mutations are proxied by trip-service (GKE Gateway: no method match).
    # Trip sub-resource social APIs are proxied by trip-service (SocialPublicApiProxyController).
    - matches:
        - path:
            type: PathPrefix
            value: /api/search
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /actuator
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /swagger-ui
      backendRefs:
        - name: trip-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v3
      backendRefs:
        - name: trip-service
          port: 8080
