# Serves static assets from the GCS frontend bucket (synced on pod start + after dev-lifecycle.sh frontend).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      initContainers:
        - name: sync-assets
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /usr/share/nginx/html
              if gsutil -q stat "gs://${GCS_BUCKET}/index.html" 2>/dev/null; then
                gsutil -m rsync -d -r "gs://${GCS_BUCKET}/" /usr/share/nginx/html/
              else
                echo '<!DOCTYPE html><html><body><p>Frontend not deployed yet. Run: ./dev-lifecycle.sh frontend</p></body></html>' > /usr/share/nginx/html/index.html
              fi
          env:
            - name: GCS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: GCS_BUCKET
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: frontend-config
