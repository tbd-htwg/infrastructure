apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  GCS_BUCKET: milestone2-tbd-cad-frontend-bucket
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /index.html {
        add_header Cache-Control "no-cache";
      }
    }
