apiVersion: v1
kind: ConfigMap
metadata:
  name: social-service-config
data:
  SERVER_PORT: "8081"
  GCP_FIRESTORE_DATABASE_ID: "tbd-firestore"
  TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "milestone2-tbd-cad"
  TRIPPLANNING_TRIP_SERVICE_URL: "http://trip-service.tripplanning.svc.cluster.local:8080"
  TRIPPLANNING_SOCIAL_SERVICE_URL: "http://social-service.tripplanning.svc.cluster.local:8080"
  # Keep in sync with trip-service-config (social routes hit this service directly via Gateway).
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://k8s.tbd-htwg.de,http://api.k8s.tbd-htwg.de,https://k8s.tbd-htwg.de,https://api.k8s.tbd-htwg.de"
