apiVersion: v1
kind: ConfigMap
metadata:
  name: trip-service-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/tripplanning"
  SPRING_DATASOURCE_USERNAME: "tripplanning_app"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_CLOUD_GCP_STORAGE_BUCKET_NAME: "milestone2-tbd-cad-images-bucket"
  GCP_IMPERSONATE_SERVICE_ACCOUNT: "tripplanning-image-url-sig@milestone2-tbd-cad.iam.gserviceaccount.com"
  TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "milestone2-tbd-cad"
  # Service port 8080 (targetPort 8081). Do not use 8081 here — NetworkPolicy allows 8080/8082 only.
  TRIPPLANNING_SOCIAL_SERVICE_URL: "http://social-service.tripplanning.svc.cluster.local:8080"
  TRIPPLANNING_EXTERNAL_INFO_SERVICE_URL: "http://external-info-service.tripplanning.svc.cluster.local:8082"
  TRIPPLANNING_TRIP_SERVICE_URL: "http://trip-service.tripplanning.svc.cluster.local:8080"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://k8s.tbd-htwg.de,http://api.k8s.tbd-htwg.de,https://k8s.tbd-htwg.de,https://api.k8s.tbd-htwg.de"
  TRIPPLANNING_SEARCH_ELASTICSEARCH_INDEX_NAME: "tripentity"
  ELASTICSEARCH_PROTOCOL: "http"
  ELASTICSEARCH_HOSTS: "elasticsearch.tripplanning.svc.cluster.local:9200"
  SPRING_ELASTICSEARCH_RESTCLIENT_SNIFFER_ENABLED: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_DISCOVERY_ENABLED: "false"
  SPRING_DATA_REDIS_HOST: "redis.tripplanning.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
