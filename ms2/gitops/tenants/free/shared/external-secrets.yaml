apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trip-service-secrets
  namespace: tripplanning-free
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: trip-service-secrets
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: tripplanning-db-password
    - secretKey: password
      remoteRef:
        key: tripplanning-db-password
    - secretKey: TRIPPLANNING_AUTH_JWT_SECRET
      remoteRef:
        key: tripplanning-jwt-secret
    - secretKey: TRIPPLANNING_INTERNAL_SECRET
      remoteRef:
        key: tripplanning-internal-secret
---
