apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-free-values
  namespace: tripplanning-free
data:
  values.yaml: |
    global:
      imagePullSecrets:
        - ghcr-pull
    services:
      apiRouter:
        replicas: 2
      trip:
        replicas: 2
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "750m"
            memory: "768Mi"
          limits:
            cpu: "2500m"
            memory: "1536Mi"
        terminationGracePeriodSeconds: 60
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        bootstrap:
          waitForValkey: false
          waitForSearch: false
        env:
          SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_CACHE_REDIS_TTL_SECONDS: "30"
      social:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "768Mi"
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_CACHE_REDIS_TTL_SECONDS: "30"
      externalInfo:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "768Mi"
        bootstrap:
          waitForValkey: false
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    backingServices:
      postgres:
        auth:
          existingSecret: trip-service-secrets
          passwordKey: password
        storageClassName: "standard-hdd-wffc"
        dataDir: "/var/lib/postgresql/data/pgdata"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "2Gi"
        extraConfigArgs:
          - max_connections=150
          - shared_buffers=256MB
          - effective_cache_size=768MB
      valkey:
        serviceName: valkey
        image: valkey/valkey:8-alpine
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
      elasticsearch:
        image: opensearchproject/opensearch:2.19.0
        javaOpts: "-Xms768m -Xmx768m"
        storageClassName: "standard-hdd-wffc"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "500m"
            memory: "1536Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 75
      scaleUpStabilizationSeconds: 60
      scaleDownStabilizationSeconds: 300
      trip:
        minReplicas: 2
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 0
      social:
        minReplicas: 1
        maxReplicas: 1
      externalInfo:
        minReplicas: 1
        maxReplicas: 2
