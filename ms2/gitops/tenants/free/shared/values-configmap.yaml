apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-free-values
  namespace: tripplanning-free
data:
  values.yaml: |
    global:
      imagePullSecrets:
        - ghcr-pull
    services:
      trip:
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        env:
          SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
          SPRING_DATA_REDIS_HOST: "valkey"
      social:
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "200m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
      externalInfo:
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
    backingServices:
      postgres:
        auth:
          existingSecret: trip-service-secrets
          passwordKey: password
        storageClassName: "standard-hdd-wffc"
        dataDir: "/var/lib/postgresql/data/pgdata"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      valkey:
        serviceName: valkey
        image: valkey/valkey:8-alpine
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "150m"
            memory: "256Mi"
      elasticsearch:
        image: opensearchproject/opensearch:2.19.0
        javaOpts: "-Xms512m -Xmx512m"
        storageClassName: "standard-hdd-wffc"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
    autoscaling:
      enabled: false
