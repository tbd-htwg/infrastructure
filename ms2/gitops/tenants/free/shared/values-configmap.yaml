apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-free-values
  namespace: tripplanning-free
data:
  values.yaml: |
    global:
      imagePullSecrets:
        - ghcr-pull
    services:
      apiRouter:
        replicas: 1
      trip:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "150m"
            memory: "768Mi"
          limits:
            cpu: "400m"
            memory: "1024Mi"
        terminationGracePeriodSeconds: 60
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        bootstrap:
          waitForValkey: true
          waitForSearch: true
        env:
          SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_CACHE_REDIS_TTL_SECONDS: "30"
          GCP_IMPERSONATE_SERVICE_ACCOUNT: "tripplanning-image-url-sig@tbd-cloudappdev.iam.gserviceaccount.com"
      social:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "150m"
            memory: "768Mi"
          limits:
            cpu: "400m"
            memory: "768Mi"
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_CACHE_REDIS_TTL_SECONDS: "30"
      externalInfo:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
          tag: latest
          pullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "768Mi"
          limits:
            cpu: "300m"
            memory: "768Mi"
        bootstrap:
          waitForValkey: false
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    apiRouter:
      loadBalancer:
        annotations:
          cloud.google.com/neg: '{"exposed_ports":{"8088":{}}}'
    backingServices:
      postgres:
        auth:
          existingSecret: trip-service-secrets
          passwordKey: password
        storageClassName: "standard-hdd-wffc"
        dataDir: "/var/lib/postgresql/data/pgdata"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
        extraConfigArgs:
          - max_connections=50
          - shared_buffers=64MB
          - effective_cache_size=256MB
      valkey:
        serviceName: valkey
        image: valkey/valkey:8-alpine
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "100m"
            memory: "512Mi"
      opensearch:
        existingClaim: data-elasticsearch-0
        image: opensearchproject/opensearch:2.19.0
        javaOpts: "-Xms384m -Xmx384m"
        storageClassName: "standard-hdd-wffc"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "200m"
            memory: "768Mi"
          limits:
            cpu: "500m"
            memory: "1280Mi"
    autoscaling:
      enabled: false
