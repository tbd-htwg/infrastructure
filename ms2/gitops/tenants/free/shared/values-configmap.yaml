apiVersion: v1
kind: ConfigMap
metadata:
  name: tripplanning-free-values
  namespace: tripplanning-free
data:
  values.yaml: |
    global:
      deployment:
        environment: dev
      frontend:
        bucketName: "${FRONTEND_BUCKET}"
      storage:
        imagesBucketName: "${IMAGES_BUCKET}"
      imagePullSecrets:
        - ghcr-pull
    services:
      apiRouter:
        replicas: 2
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      trip:
        replicas: 1
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-trip-service
          tag: develop
          pullPolicy: Always
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        terminationGracePeriodSeconds: 60
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        bootstrap:
          waitForValkey: true
          waitForSearch: true
        env:
          SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_CACHE_REDIS_TTL_SECONDS: "30"
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "${GCP_PROJECT_ID}"
          GCP_IMPERSONATE_SERVICE_ACCOUNT: "tripplanning-image-url-sig@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      social:
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-social-service
          tag: develop
          pullPolicy: Always
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"
        env:
          TRIPPLANNING_AUTH_FIREBASE_PROJECT_ID: "${GCP_PROJECT_ID}"
          GCP_FIRESTORE_DATABASE_ID: "${FIRESTORE_DATABASE_ID}"
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          TRIPPLANNING_CACHE_REDIS_TTL_SECONDS: "30"
      externalInfo:
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        image:
          repository: ghcr.io/tbd-htwg/backend/tripplanning-external-info-service
          tag: develop
          pullPolicy: Always
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"
        bootstrap:
          waitForValkey: false
        env:
          SPRING_DATA_REDIS_HOST: "valkey"
          JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    apiRouter:
      loadBalancer:
        enabled: true
        ip: "${STANDARD_LB_IP}"
        externalTrafficPolicy: Cluster
        annotations:
          cloud.google.com/neg: '{"exposed_ports":{"8088":{}}}'
    seedJob:
      googleCloudProject: "${GCP_PROJECT_ID}"
      firestoreDatabaseId: "${FIRESTORE_DATABASE_ID}"
    backingServices:
      postgres:
        auth:
          existingSecret: trip-service-secrets
          passwordKey: password
        storageClassName: "standard-hdd-wffc"
        dataDir: "/var/lib/postgresql/data/pgdata"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        extraConfigArgs:
          - max_connections=50
          - shared_buffers=64MB
          - effective_cache_size=256MB
      valkey:
        serviceName: valkey
        image: valkey/valkey:8-alpine
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
      opensearch:
        existingClaim: ""
        image: opensearchproject/opensearch:2.19.0
        javaOpts: "-Xms384m -Xmx384m"
        storageClassName: "standard-hdd-wffc"
        storageSize: 1Gi
        resources:
          requests:
            cpu: "250m"
            memory: "768Mi"
          limits:
            cpu: "1000m"
            memory: "1280Mi"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 75
      scaleUpStabilizationSeconds: 60
      scaleDownStabilizationSeconds: 300
      trip:
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 0
      social:
        minReplicas: 1
        maxReplicas: 4
      externalInfo:
        minReplicas: 1
        maxReplicas: 4
