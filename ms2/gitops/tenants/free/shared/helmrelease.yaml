apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tripplanning-free
  namespace: tripplanning-free
spec:
  interval: 10m
  chart:
    spec:
      chart: infrastructure/ms2/charts/tripplanning
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: tripplanning-free-values
      valuesKey: values.yaml
  values:
    global:
      gateway:
        name: tripplanning-gateway
        namespace: gateway-system
      hosts:
        api: api.k8s.tbd-htwg.de
