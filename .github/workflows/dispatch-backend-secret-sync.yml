name: Dispatch backend secret sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "ms2/gitops/tenants/**"

permissions:
  contents: read

concurrency:
  group: dispatch-backend-secret-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: gke-dev
    env:
      BACKEND_REPO: ${{ vars.BACKEND_REPOSITORY }}
      BACKEND_DISPATCH_TOKEN: ${{ secrets.BACKEND_REPOSITORY_DISPATCH_TOKEN }}
      DISPATCH_EVENT_TYPE: tenant-created

    steps:
      - name: Validate dispatch configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BACKEND_REPO:-}" ]]; then
            echo "Missing GitHub variable: BACKEND_REPOSITORY" >&2
            exit 1
          fi

          if [[ -z "${BACKEND_DISPATCH_TOKEN:-}" ]]; then
            echo "Missing GitHub secret: BACKEND_REPOSITORY_DISPATCH_TOKEN" >&2
            exit 1
          fi

      - name: Dispatch backend secret sync
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPOSITORY_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          payload='{"event_type":"'"${DISPATCH_EVENT_TYPE}"'","client_payload":{"source_repo":"'"${GITHUB_REPOSITORY}"'","source_ref":"'"${GITHUB_REF_NAME}"'","source_sha":"'"${GITHUB_SHA}"'"}}'

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BACKEND_REPO}/dispatches" \
            -d "${payload}"

          echo "Dispatched ${DISPATCH_EVENT_TYPE} to ${BACKEND_REPO}"
