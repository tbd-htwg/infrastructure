name: Tenant provision

on:
  repository_dispatch:
    types:
      - tenant-created-standard
      - tenant-created-enterprise
  workflow_dispatch:
    inputs:
      slug:
        description: Tenant slug
        required: true
      tier:
        description: STANDARD or ENTERPRISE
        required: true
        type: choice
        options:
          - STANDARD
          - ENTERPRISE
      brandName:
        description: Tenant brand name
        required: false
      colorScheme:
        description: Tenant color scheme
        required: false
        default: default
      imageTag:
        description: Enterprise service image tag
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: tenant-provision-${{ github.event.client_payload.slug || inputs.slug }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: gke-dev
    env:
      MS2_DIR: ms2
      TF_DIR: ms2/terraform/envs/dev
      APPLY_TERRAFORM: ${{ vars.TENANT_PROVISION_APPLY_TERRAFORM || 'false' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      FLUX_BOOTSTRAP_GIT_PASSWORD: ${{ secrets.FLUX_BOOTSTRAP_GIT_PASSWORD }}
      PLATFORM_GITHUB_DISPATCH_TOKEN: ${{ secrets.PLATFORM_GITHUB_DISPATCH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            slug="${{ inputs.slug }}"
            tier="${{ inputs.tier }}"
            brand_name="${{ inputs.brandName }}"
            color_scheme="${{ inputs.colorScheme }}"
            image_tag="${{ inputs.imageTag }}"
          else
            slug="${{ github.event.client_payload.slug }}"
            tier="${{ github.event.client_payload.tier || '' }}"
            brand_name="${{ github.event.client_payload.brandName || '' }}"
            color_scheme="${{ github.event.client_payload.colorScheme || 'default' }}"
            identity_platform_tenant_id="${{ github.event.client_payload.identityPlatformTenantId || '' }}"
            image_tag="${{ github.event.client_payload.imageTag || '' }}"
          fi

          if [[ -z "${tier}" && "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            case "${{ github.event.action }}" in
              tenant-created-standard) tier="STANDARD" ;;
              tenant-created-enterprise) tier="ENTERPRISE" ;;
            esac
          fi

          tier="$(echo "${tier}" | tr '[:lower:]' '[:upper:]')"
          if [[ ! "${slug}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Invalid slug: ${slug}" >&2
            exit 1
          fi
          if [[ "${tier}" != "STANDARD" && "${tier}" != "ENTERPRISE" ]]; then
            echo "tier must be STANDARD or ENTERPRISE" >&2
            exit 1
          fi

          if [[ -z "${brand_name}" ]]; then
            brand_name="${slug}"
          fi

          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          echo "brand_name=${brand_name}" >> "$GITHUB_OUTPUT"
          echo "color_scheme=${color_scheme}" >> "$GITHUB_OUTPUT"
          echo "identity_platform_tenant_id=${identity_platform_tenant_id:-}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag:-}" >> "$GITHUB_OUTPUT"

      - name: Install renderer dependencies
        run: python3 -m pip install pyyaml

      - name: Write tenant definition
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.payload.outputs.slug }}"
          tier="${{ steps.payload.outputs.tier }}"
          brand_name="${{ steps.payload.outputs.brand_name }}"
          color_scheme="${{ steps.payload.outputs.color_scheme }}"
          identity_platform_tenant_id="${{ steps.payload.outputs.identity_platform_tenant_id }}"
          image_tag="${{ steps.payload.outputs.image_tag }}"
          project_id="${GCP_PROJECT_ID}"

          if [[ "${tier}" == "STANDARD" ]]; then
            mkdir -p "${MS2_DIR}/tenants/standard"
            tenant_path="${MS2_DIR}/tenants/standard/${slug}.yaml"
          else
            if [[ -z "${project_id}" ]]; then
              echo "GCP_PROJECT_ID repo/environment variable is required for Enterprise tenants" >&2
              exit 1
            fi
            mkdir -p "${MS2_DIR}/tenants/enterprise"
            tenant_path="${MS2_DIR}/tenants/enterprise/${slug}.yaml"
          fi

          export TENANT_PATH="${tenant_path}"
          export TENANT_SLUG="${slug}"
          export TENANT_TIER="${tier}"
          export TENANT_BRAND_NAME="${brand_name}"
          export TENANT_COLOR_SCHEME="${color_scheme}"
          export TENANT_IDENTITY_PLATFORM_TENANT_ID="${identity_platform_tenant_id}"
          export TENANT_IMAGE_TAG="${image_tag}"
          export TENANT_PROJECT_ID="${project_id}"
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          slug = os.environ["TENANT_SLUG"]
          tier = os.environ["TENANT_TIER"]
          brand_name = os.environ["TENANT_BRAND_NAME"]
          color_scheme = os.environ["TENANT_COLOR_SCHEME"]
          identity_platform_tenant_id = os.environ["TENANT_IDENTITY_PLATFORM_TENANT_ID"]
          image_tag = os.environ["TENANT_IMAGE_TAG"]
          project_id = os.environ["TENANT_PROJECT_ID"]

          def identity_display_name(value: str) -> str:
              cleaned = re.sub(r"[^a-z0-9-]", "-", value.lower())
              if not cleaned or not cleaned[0].isalpha():
                  cleaned = f"t-{cleaned}"
              if len(cleaned) < 4:
                  cleaned = f"{cleaned}-tenant"
              return cleaned[:20]

          identity = {
              "displayName": identity_display_name(slug),
              "emailPasswordEnabled": True,
              "mfaEnabled": tier == "ENTERPRISE",
          }
          if identity_platform_tenant_id:
              identity["tenantId"] = identity_platform_tenant_id

          if tier == "STANDARD":
              tenant = {
                  "tenantId": slug,
                  "tier": "standard",
                  "hostnames": [f"{slug}.k8s.tbd-htwg.de"],
                  "identityPlatform": identity,
                  "frontend": {
                      "bucketPrefix": f"standard/{slug}",
                      "brandName": brand_name,
                      "colorScheme": color_scheme,
                      "brandIcon": "assets/brand-icon.png",
                  },
                  "database": {
                      "cloudSqlInstance": "tripplanning-standard",
                      "databaseName": f"tripplanning_std_{slug.replace('-', '_')}",
                      "userName": f"tripplanning_app_{slug.replace('-', '_')}",
                  },
                  "storage": {"imagesPrefix": f"standard/{slug}"},
                  "search": {"indexName": f"tripentity-{slug}"},
                  "cache": {"keyPrefix": f"std:{slug}"},
              }
          else:
              tenant = {
                  "tenantId": slug,
                  "tier": "enterprise",
                  "projectId": project_id,
                  "namespace": f"tripplanning-ent-{slug}",
                  "hostnames": [f"{slug}.enterprise.k8s.tbd-htwg.de"],
                  "identityPlatform": identity,
                  "frontend": {
                      "bucketPrefix": f"enterprise/{slug}",
                      "brandName": brand_name,
                      "colorScheme": color_scheme,
                      "brandIcon": "assets/brand-icon.png",
                  },
                  "database": {
                      "cloudSqlInstance": f"tripplanning-ent-{slug}",
                      "databaseName": "tripplanning",
                      "userName": "tripplanning_app",
                  },
                  "storage": {"imageBucketName": f"{project_id}-{slug}-images-bucket"},
                  "search": {"releaseName": f"opensearch-{slug}"},
                  "cache": {"dedicated": True},
              }
              if image_tag:
                  tenant["services"] = {
                      "trip": {"image": {"tag": image_tag, "pullPolicy": "Always"}},
                      "social": {"image": {"tag": image_tag, "pullPolicy": "Always"}},
                      "externalInfo": {"image": {"tag": image_tag, "pullPolicy": "Always"}},
                  }

          Path(os.environ["TENANT_PATH"]).write_text(yaml.safe_dump(tenant, sort_keys=False), encoding="utf-8")
          PY

      - name: Render Terraform and GitOps inputs
        working-directory: ms2
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APPLY_TERRAFORM}" == "true" ]]; then
            python3 scripts/render-tenants.py
          else
            python3 scripts/render-tenants.py --terraform-only
          fi

      - name: Optional Terraform apply
        if: env.APPLY_TERRAFORM == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Optional Terraform setup
        if: env.APPLY_TERRAFORM == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Optional Google Cloud SDK setup
        if: env.APPLY_TERRAFORM == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Optional kubectl setup
        if: env.APPLY_TERRAFORM == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud components install kubectl --quiet

      - name: Optional Terraform apply and rerender computed IDs
        if: env.APPLY_TERRAFORM == 'true'
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_DIR}" init -input=false

          # Keep the existing load-balancer certificate attached while Certificate
          # Manager performs the asynchronous initial wildcard issuance.
          TF_VAR_flux_bootstrap_git_password="${FLUX_BOOTSTRAP_GIT_PASSWORD}" \
          TF_VAR_platform_github_dispatch_token="${PLATFORM_GITHUB_DISPATCH_TOKEN}" \
            terraform -chdir="${TF_DIR}" apply \
              -target=module.frontend_lb.google_certificate_manager_certificate.frontend \
              -auto-approve \
              -input=false

          certificate_state="UNKNOWN"
          for _ in {1..120}; do
            certificate_json="$(gcloud certificate-manager certificates describe frontend-wildcard-cert \
              --location=global \
              --project="${GCP_PROJECT_ID}" \
              --format=json)"
            certificate_state="$(jq -r '.managed.state // "UNKNOWN"' <<<"${certificate_json}")"

            if [[ "${certificate_state}" == "ACTIVE" ]]; then
              break
            fi
            if [[ "${certificate_state}" == "FAILED" ]]; then
              jq '.managed.provisioningIssue, .managed.authorizationAttemptInfo' <<<"${certificate_json}" >&2
              exit 1
            fi
            sleep 15
          done

          if [[ "${certificate_state}" != "ACTIVE" ]]; then
            echo "frontend-wildcard-cert did not become ACTIVE within 30 minutes" >&2
            exit 1
          fi

          TF_VAR_flux_bootstrap_git_password="${FLUX_BOOTSTRAP_GIT_PASSWORD}" \
          TF_VAR_platform_github_dispatch_token="${PLATFORM_GITHUB_DISPATCH_TOKEN}" \
            terraform -chdir="${TF_DIR}" apply -auto-approve -input=false
          terraform -chdir="${TF_DIR}" output -json > /tmp/ms2-terraform-output.json
          (cd "${MS2_DIR}" && python3 scripts/render-tenants.py --terraform-output-json /tmp/ms2-terraform-output.json)

      - name: Verify generated tenant files
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.payload.outputs.slug }}"
          tier="${{ steps.payload.outputs.tier }}"

          grep -q "\"${slug}\"" "${MS2_DIR}/terraform/envs/dev/generated-tenants.auto.tfvars.json"

          if [[ "${APPLY_TERRAFORM}" == "true" ]]; then
            if [[ "${tier}" == "STANDARD" ]]; then
              grep -q "tenantId: ${slug}" "${MS2_DIR}/gitops/tenants/standard/shared/generated-tenants-configmap.yaml"
            else
              test -f "${MS2_DIR}/gitops/tenants/enterprise/${slug}/helmrelease.yaml"
            fi
          fi

      - name: Commit generated tenant files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ms2/tenants \
            ms2/terraform/envs/dev/generated-tenants.auto.tfvars.json \
            ms2/gitops/tenants

          if git diff --cached --quiet; then
            echo "No tenant changes to commit."
            exit 0
          fi

          echo "Committing generated tenant files:"
          git diff --cached --name-status
          git commit -m "Provision tenant ${{ steps.payload.outputs.slug }}"
          git push

      - name: Notify platform tenant ready
        if: env.APPLY_TERRAFORM == 'true'
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.payload.outputs.slug }}"
          tier="${{ steps.payload.outputs.tier }}"
          cluster_name="$(jq -r '.gke_cluster_name.value' /tmp/ms2-terraform-output.json)"
          cluster_location="$(jq -r '.gke_cluster_location.value' /tmp/ms2-terraform-output.json)"

          gcloud container clusters get-credentials "${cluster_name}" \
            --region "${cluster_location}" \
            --project "${GCP_PROJECT_ID}"

          kubectl -n flux-system annotate gitrepository flux-system \
            "reconcile.fluxcd.io/requestedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --overwrite
          kubectl -n flux-system annotate kustomization tenants \
            "reconcile.fluxcd.io/requestedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --overwrite

          if [[ "${tier}" == "ENTERPRISE" ]]; then
            namespace="tripplanning-ent-${slug}"
            helmrelease="tripplanning-enterprise-${slug}"
          else
            namespace="tripplanning-standard"
            helmrelease="tripplanning-standard"
          fi

          for _ in {1..120}; do
            if kubectl get namespace "${namespace}" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl get namespace "${namespace}" >/dev/null

          for _ in {1..120}; do
            if kubectl get "helmrelease/${helmrelease}" -n "${namespace}" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl get "helmrelease/${helmrelease}" -n "${namespace}" >/dev/null

          kubectl wait --for=condition=Ready "helmrelease/${helmrelease}" \
            -n "${namespace}" \
            --timeout=25m

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual workflow dispatch completed infrastructure provisioning."
            echo "Skipping platform-service callback because manual dispatch does not create a platform tenant registry record."
            exit 0
          fi

          internal_secret="$(gcloud secrets versions access latest \
            --secret=tripplanning-internal-secret \
            --project="${GCP_PROJECT_ID}")"

          # Use the existing platform-service pod instead of scheduling a
          # one-shot callback pod. Autopilot may be temporarily unable to
          # schedule extra pods when a zone is short on capacity.
          callback_port=18083
          port_forward_log="/tmp/platform-service-port-forward.log"
          kubectl -n tripplanning-system port-forward \
            service/platform-service \
            "${callback_port}:8083" \
            >"${port_forward_log}" 2>&1 &
          port_forward_pid=$!
          trap 'kill "${port_forward_pid}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if ! kill -0 "${port_forward_pid}" 2>/dev/null; then
              cat "${port_forward_log}" >&2
              exit 1
            fi
            if curl --connect-timeout 1 --max-time 2 -s -o /dev/null \
              "http://127.0.0.1:${callback_port}/actuator/health/readiness"; then
              break
            fi
            sleep 1
          done

          if ! curl --connect-timeout 1 --max-time 2 -s -o /dev/null \
            "http://127.0.0.1:${callback_port}/actuator/health/readiness"; then
            cat "${port_forward_log}" >&2
            exit 1
          fi

          curl \
            --fail-with-body \
            -sS \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Internal-Secret: ${internal_secret}" \
            --data '{"status":"ACTIVE"}' \
            "http://127.0.0.1:${callback_port}/internal/tenants/${slug}/provisioning-callback"
